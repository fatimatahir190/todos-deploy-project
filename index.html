<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — a small list of things to do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#2B3648;
    --paper:#F6F4EC;
    --paper-dim:#EAE6D9;
    --line:#D8D2BF;
    --amber:#E3A008;
    --amber-deep:#B77E05;
    --coral:#D9584F;
    --ok:#3F7B5C;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 20px -12px rgba(20,20,10,.35);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #26314424 0%, transparent 55%),
      var(--ink);
    background-attachment:fixed;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding:64px 20px 120px;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
  }

  header{
    margin-bottom:40px;
    color:var(--paper);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .eyebrow::before{
    content:"";
    width:18px; height:1px;
    background:var(--amber);
    display:inline-block;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:44px;
    line-height:1.05;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--amber);
  }
  .sub{
    font-size:15px;
    color:#B9C2D0;
    max-width:46ch;
    line-height:1.5;
  }
  .count{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:#8B94A3;
    margin-top:18px;
  }
  .count strong{ color:var(--amber); font-weight:500; }

  .add-card{
    background:var(--paper);
    border-radius:4px;
    padding:26px 26px 22px;
    box-shadow:var(--shadow);
    position:relative;
    margin-bottom:48px;
  }
  .add-card::before{
    content:"";
    position:absolute;
    top:0; left:22px; right:22px;
    height:1px;
    background:repeating-linear-gradient(to right, var(--line) 0 6px, transparent 6px 12px);
  }
  .form-title{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--amber-deep);
    margin:0 0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-family:'JetBrains Mono', monospace;
    color:#8A8368;
    margin-bottom:6px;
    letter-spacing:.03em;
  }
  .field input[type=text]{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    font-family:'Fraunces', serif;
    font-size:19px;
    padding:6px 2px 8px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .field input[type=text]::placeholder{ color:#B7B09A; font-style:italic; }
  .field input[type=text]:focus{ border-bottom-color:var(--amber); }

  .check-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 20px;
    user-select:none;
  }
  .check-row input[type=checkbox]{
    appearance:none;
    width:19px; height:19px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
  }
  .check-row input[type=checkbox]:checked{
    background:var(--ok);
    border-color:var(--ok);
  }
  .check-row input[type=checkbox]:checked::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:10px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .check-row label{
    font-size:13px;
    color:#6B6450;
    cursor:pointer;
  }

  .btn-row{ display:flex; gap:10px; align-items:center; }
  button{ font-family:'Inter', sans-serif; cursor:pointer; border:none; }

  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    font-weight:500;
    letter-spacing:.02em;
    padding:11px 22px;
    border-radius:3px;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background:var(--ink-soft); }
  .btn-primary:active{ transform:translateY(1px); }

  .btn-ghost{
    background:transparent;
    color:#8A8368;
    font-size:13px;
    padding:11px 14px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .btn-ghost:hover{ color:var(--coral); }

  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:16px;
    color:var(--paper);
  }
  .list-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:20px;
    margin:0;
  }
  .list-head span{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#8B94A3;
  }

  #todoList{ display:flex; flex-direction:column; gap:12px; }

  .empty{
    background:transparent;
    border:1px dashed #3C4A61;
    border-radius:4px;
    padding:32px 20px;
    text-align:center;
    color:#8B94A3;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    line-height:1.7;
  }

  .card{
    background:var(--paper);
    border-radius:3px;
    padding:18px 20px;
    box-shadow:var(--shadow);
    position:relative;
    display:flex;
    gap:14px;
    align-items:flex-start;
    animation:rise .35s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .card::before{
    content:"";
    position:absolute;
    left:0; top:14px; bottom:14px;
    width:3px;
    background:var(--line);
    border-radius:0 2px 2px 0;
  }
  .card.done::before{ background:var(--ok); }

  .card-check{
    width:20px; height:20px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    flex-shrink:0;
    margin-top:2px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    padding:0;
    transition:all .15s ease;
  }
  .card-check svg{ opacity:0; width:11px; height:11px; }
  .card.done .card-check{ background:var(--ok); border-color:var(--ok); }
  .card.done .card-check svg{ opacity:1; }

  .card-body{ flex:1; min-width:0; }
  .card-title{
    font-family:'Fraunces', serif;
    font-size:18px;
    font-weight:500;
    margin:0 0 4px;
    color:var(--ink);
    word-break:break-word;
  }
  .card.done .card-title{
    color:#9A947F;
    text-decoration:line-through;
    text-decoration-color:#B9B29A;
  }
  .card-desc{
    font-size:13.5px;
    color:#6B6450;
    line-height:1.5;
    margin:0;
    word-break:break-word;
  }
  .card.done .card-desc{ color:#ACA692; }

  .card-tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ok);
    background:#E5EEE7;
    padding:2px 7px;
    border-radius:10px;
    margin-top:8px;
  }

  .card-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex-shrink:0;
  }
  .icon-btn{
    width:28px; height:28px;
    border-radius:3px;
    background:transparent;
    color:#A39C86;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background:var(--paper-dim); color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--coral); }
  .icon-btn svg{ width:15px; height:15px; }

  .toast{
    position:fixed;
    bottom:26px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    padding:11px 18px;
    border-radius:4px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:10;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .dot{ width:6px; height:6px; border-radius:50%; background:var(--amber); flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:480px){
    h1{ font-size:34px; }
    .add-card{ padding:20px; }
  }

  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
</style>
</head>

<body>
  <div class="wrap">

    <header>
      <p class="eyebrow">A running list</p>
      <h1>The <em>ledger</em> of<br>things to do</h1>
      <p class="sub">Write it down, cross it off. Nothing syncs to the cloud of your mind — it lives here instead.</p>
      <p class="count" id="countLine">Loading your list…</p>
    </header>

    <section class="add-card">
      <p class="form-title">
        <span id="formTitle">New entry</span>
      </p>

      <form id="todoForm">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="What needs doing?" required autocomplete="off">
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Any detail worth remembering" required autocomplete="off">
        </div>

        <div class="check-row">
          <input type="checkbox" id="is_completed">
          <label for="is_completed">Already done</label>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary" id="submitBtn">Add to the list</button>
          <button type="button" class="btn-ghost" id="cancelBtn" style="display:none;" onclick="cancelEdit()">Cancel edit</button>
        </div>
      </form>
    </section>

    <div class="list-head">
      <h2>Currently on it</h2>
      <span id="listMeta"></span>
    </div>

    <div id="todoList">
      <div class="empty">Nothing here yet — add the first thing above.</div>
    </div>

  </div>

  <div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
  // ---- deployed backend on Railway ----
  const API_URL = "https://todos-production-0389.up.railway.app";

  let editingId = null;
  let todosCache = [];

  function showToast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  const form = document.getElementById('todoForm');

  form.addEventListener('submit', async function(event){
    event.preventDefault();

    const title = document.getElementById('title').value.trim();
    const description = document.getElementById('description').value.trim();
    const is_completed = document.getElementById('is_completed').checked;

    try{
      if(editingId === null){
        const response = await fetch(`${API_URL}/todos`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ title, description, is_completed })
        });
        if(!response.ok) throw new Error('Request failed');
        await response.json();
        showToast('Added to the list.');
      } else {
        const response = await fetch(`${API_URL}/todos/${editingId}`, {
          method:'PUT',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ title, description, is_completed })
        });
        if(!response.ok) throw new Error('Request failed');
        await response.json();
        showToast('Entry updated.');
        cancelEdit();
      }

      form.reset();
      getTodos();

    } catch(err){
      console.error(err);
      showToast('Something went wrong — check the server.');
    }
  });

  async function getTodos(){
    try{
      const response = await fetch(`${API_URL}/todos`);
      const todos = await response.json();
      todosCache = todos;
      renderTodos(todos);
    } catch(err){
      console.error(err);
      document.getElementById('countLine').textContent = "Can't reach the server right now.";
    }
  }

  function renderTodos(todos){
    const listEl = document.getElementById('todoList');
    const doneCount = todos.filter(t => t.is_completed).length;

    document.getElementById('countLine').innerHTML =
      todos.length === 0
        ? "The list is empty. A clean slate."
        : `<strong>${doneCount}</strong> of ${todos.length} crossed off`;

    document.getElementById('listMeta').textContent =
      todos.length ? `${todos.length} total` : '';

    if(todos.length === 0){
      listEl.innerHTML = '<div class="empty">Nothing here yet — add the first thing above.</div>';
      return;
    }

    listEl.innerHTML = '';

    todos.forEach(todo => {
      const card = document.createElement('div');
      card.className = 'card' + (todo.is_completed ? ' done' : '');
      card.innerHTML = `
        <button class="card-check" title="Toggle done" onclick='toggleDone(${todo.id}, ${!todo.is_completed})'>
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
        <div class="card-body">
          <p class="card-title">${escapeHtml(todo.title)}</p>
          <p class="card-desc">${escapeHtml(todo.description)}</p>
          ${todo.is_completed ? '<span class="card-tag">Done</span>' : ''}
        </div>
        <div class="card-actions">
          <button class="icon-btn" title="Edit" onclick='startEdit(${todo.id})'>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
          </button>
          <button class="icon-btn danger" title="Delete" onclick='deleteTodo(${todo.id})'>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path><path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          </button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function startEdit(id){
    const todo = todosCache.find(t => t.id === id);
    if(!todo) return;

    editingId = id;
    document.getElementById('title').value = todo.title;
    document.getElementById('description').value = todo.description;
    document.getElementById('is_completed').checked = todo.is_completed;

    document.getElementById('formTitle').textContent = 'Editing entry';
    document.getElementById('submitBtn').textContent = 'Save changes';
    document.getElementById('cancelBtn').style.display = 'inline-block';

    window.scrollTo({ top:0, behavior:'smooth' });
    document.getElementById('title').focus();
  }

  function cancelEdit(){
    editingId = null;
    form.reset();
    document.getElementById('formTitle').textContent = 'New entry';
    document.getElementById('submitBtn').textContent = 'Add to the list';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  async function toggleDone(id, newState){
    const todo = todosCache.find(t => t.id === id);
    if(!todo) return;
    try{
      await fetch(`${API_URL}/todos/${id}`, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ title: todo.title, description: todo.description, is_completed: newState })
      });
      getTodos();
    } catch(err){
      console.error(err);
      showToast('Could not update — try again.');
    }
  }

  async function deleteTodo(id){
    try{
      await fetch(`${API_URL}/todos/${id}`, { method:'DELETE' });
      showToast('Removed from the list.');
      if(editingId === id) cancelEdit();
      getTodos();
    } catch(err){
      console.error(err);
      showToast('Could not delete — try again.');
    }
  }

  getTodos();
</script>
</body>
</html>
